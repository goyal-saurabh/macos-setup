# Personal identity. The only file with personal values: the identity
# templates under dotfiles/ (git identity, GitHub/GitLab configs,
# allowed_signers, ssh config.identity, 1Password agent), the PROJECTS_DIR env
# and the pnpm and gh config files render from these `[vars]` on
# `mise bootstrap`. An adopter replaces this file wholesale.
[vars]
editor       = "code"                                                                             # gh's editor
github_email = "44016860+goyal-saurabh@users.noreply.github.com"
gitlab_email = "39262394-sg.platform@users.noreply.gitlab.com"
name         = "Saurabh Goyal"
op_ssh_vault = "Personal"                                                                         # 1Password vault holding the SSH keys
projects_dir = "~/Projects"                                                                       # holds github.com/<user>/<repo>, gitlab.com/…
signing_key  = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKLgehsmSRzkM3C67sKtMcIgEOLO7lNlqMtkI3X7dBm3"
ssh_user     = "goyal-saurabh"

# Packages exempt from pnpm's release-age cooldown (your own scopes),
# space-separated: [vars] values must be strings
pnpm_release_age_exclude = ""
